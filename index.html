<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f2a1f">
<title>Michigan Hunting Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Barlow:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
/* Layout: full-screen map; layer panel docks left on wide screens, slides up as a sheet on phones. */
:root {
  --bg: #f4f5f0;          /* panel paper */
  --fg: #1f2a1f;          /* forest ink */
  --muted: #5d6a5c;
  --line: #d5dacf;
  --chip: #e7ebe1;
  --blaze: #e2571c;       /* hunter orange, used sparingly */
  --blaze-ink: #ffffff;
  --shadow: 0 6px 24px rgba(20, 30, 20, .18);
  --f-display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --f-body: "Barlow", "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #18201a; --fg: #e6ebe2; --muted: #9eaa9c; --line: #2f3b31; --chip: #243026;
    --blaze: #f26a2e; --blaze-ink: #1a0e07; --shadow: 0 6px 24px rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #18201a; --fg: #e6ebe2; --muted: #9eaa9c; --line: #2f3b31; --chip: #243026;
  --blaze: #f26a2e; --blaze-ink: #1a0e07; --shadow: 0 6px 24px rgba(0, 0, 0, .5);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font: 15px/1.4 var(--f-body); overflow: hidden; }
#map { position: absolute; inset: 0; }

.topbar {
  position: absolute; z-index: 5; top: calc(10px + env(safe-area-inset-top, 0px));
  left: calc(10px + env(safe-area-inset-left, 0px)); right: calc(56px + env(safe-area-inset-right, 0px));
  display: flex; gap: 8px; align-items: center; flex-wrap: wrap; pointer-events: none;
}
.topbar > * { pointer-events: auto; }
.brand {
  background: var(--bg); color: var(--fg); border-radius: 10px; box-shadow: var(--shadow);
  padding: 7px 12px; font: 600 18px/1 var(--f-display); letter-spacing: .02em; text-transform: uppercase;
  display: flex; align-items: center; gap: 8px;
}
.brand i { width: 10px; height: 10px; background: var(--blaze); border-radius: 2px; display: inline-block; }
.pill {
  background: var(--bg); color: var(--fg); border: 0; border-radius: 10px; box-shadow: var(--shadow);
  padding: 8px 12px; font: 500 14px/1.1 var(--f-body); display: flex; gap: 6px; align-items: center; cursor: pointer;
}
.pill:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--blaze); outline-offset: 2px; }
.pill b { font-weight: 600; font-variant-numeric: tabular-nums; }
.pill.primary { background: var(--blaze); color: var(--blaze-ink); }

.panel {
  position: absolute; z-index: 6; background: var(--bg); color: var(--fg); box-shadow: var(--shadow);
  display: flex; flex-direction: column; overflow: hidden;
}
.panel header {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 12px 16px 8px; border-bottom: 1px solid var(--line);
}
.panel h2 { margin: 0; font: 600 20px/1 var(--f-display); letter-spacing: .03em; text-transform: uppercase; }
.panel .close { background: none; border: 0; color: var(--muted); font-size: 22px; line-height: 1; cursor: pointer; padding: 4px 8px; }
.panel .scroll { overflow-y: auto; padding: 4px 16px 20px; -webkit-overflow-scrolling: touch; }
.sec { padding: 12px 0 6px; border-bottom: 1px solid var(--line); }
.sec:last-child { border-bottom: 0; }
.sec h3 {
  margin: 0 0 8px; font: 600 13px/1 var(--f-display); letter-spacing: .12em; text-transform: uppercase; color: var(--muted);
  display: flex; justify-content: space-between; align-items: center;
}
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; background: var(--chip); padding: 3px; border-radius: 9px; }
.seg button {
  border: 0; background: transparent; color: var(--fg); padding: 7px 4px; border-radius: 7px; font: 500 14px var(--f-body); cursor: pointer;
}
.seg button[aria-pressed="true"] { background: var(--bg); box-shadow: 0 1px 3px rgba(0,0,0,.15); font-weight: 600; }
.row { display: flex; align-items: center; gap: 10px; padding: 5px 0; cursor: pointer; min-height: 32px; }
.row input { width: 18px; height: 18px; accent-color: var(--blaze); margin: 0; flex: none; }
.row .sw { width: 18px; height: 14px; border-radius: 3px; flex: none; border: 1px solid rgba(0,0,0,.25); }
.row .lbl { flex: 1; min-width: 0; }
.row .note { display: block; font-size: 12.5px; color: var(--muted); }
.row .note.warn { color: var(--blaze); }
.grp { margin: 8px 0 2px; }
.grp > .row { font-weight: 600; }
.grp .kids { padding-left: 28px; }
.small { font-size: 12.5px; color: var(--muted); margin: 6px 0 0; }
.slider { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); padding: 2px 0 6px 28px; }
.slider input { flex: 1; accent-color: var(--blaze); }
.legend-wind { display: flex; gap: 10px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); padding: 4px 0 0 28px; }
.legend-wind span { display: inline-flex; align-items: center; gap: 4px; }
.legend-wind i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }

/* Wide screens: docked left */
@media (min-width: 800px) {
  .panel { top: calc(64px + env(safe-area-inset-top, 0px)); left: 10px; bottom: 30px; width: 320px; border-radius: 12px; }
  .panel[data-open="false"] { display: none; }
}
/* Phones: bottom sheet */
@media (max-width: 799px) {
  .panel {
    left: 0; right: 0; bottom: 0; max-height: 62%; border-radius: 16px 16px 0 0;
    padding-bottom: env(safe-area-inset-bottom, 0px); transition: transform .25s ease;
  }
  .panel[data-open="false"] { transform: translateY(105%); }
  .panel .scroll { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
}
@media (prefers-reduced-motion: reduce) { .panel { transition: none; } }

/* Popups */
.maplibregl-popup-content {
  background: var(--bg); color: var(--fg); border-radius: 10px; box-shadow: var(--shadow); padding: 12px 14px; font: 14px/1.4 var(--f-body); max-width: 280px;
}
.maplibregl-popup-tip { border-top-color: var(--bg) !important; border-bottom-color: var(--bg) !important; }
.maplibregl-popup-close-button { color: var(--muted); font-size: 18px; padding: 2px 8px; }
.pop h4 { margin: 0 24px 4px 0; font: 600 18px/1.1 var(--f-display); }
.pop .tag { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; margin: 2px 0 6px; }
.pop .tag i { width: 12px; height: 12px; border-radius: 2px; display: inline-block; border: 1px solid rgba(0,0,0,.25); }
.pop dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 4px 0 0; font-size: 13px; }
.pop dt { color: var(--muted); }
.pop dd { margin: 0; font-variant-numeric: tabular-nums; }
.pop .access-OA { color: #2f8a3a; font-weight: 600; }
.pop .access-RA { color: #b7791f; font-weight: 600; }
.pop .access-XA { color: #c0392b; font-weight: 600; }
.pop .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }

.toast {
  position: absolute; z-index: 7; left: 50%; transform: translateX(-50%); bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: 10px; font-size: 14px; box-shadow: var(--shadow);
  max-width: calc(100% - 32px);
}
.maplibregl-ctrl-top-right { top: env(safe-area-inset-top, 0px); right: env(safe-area-inset-right, 0px); }
</style>
</head>
<body>
<div id="map" role="application" aria-label="Map of Michigan public land"></div>

<div class="topbar">
  <div class="brand"><i aria-hidden="true"></i>Michigan Hunting Map</div>
  <button class="pill primary" id="btnLayers" aria-controls="panel" aria-expanded="false">Layers</button>
  <button class="pill" id="btnWind" title="Refresh wind">Wind <b id="windAge">loading...</b></button>
</div>

<aside class="panel" id="panel" data-open="false" aria-label="Map layers">
  <header>
    <h2>Layers</h2>
    <button class="close" id="btnClose" aria-label="Close layers">&times;</button>
  </header>
  <div class="scroll">
    <section class="sec">
      <h3>Base map</h3>
      <div class="seg" role="group" aria-label="Base map">
        <button id="base-hybrid" data-base="hybrid">Hybrid</button>
        <button id="base-sat" data-base="sat">Satellite</button>
        <button id="base-topo" data-base="topo">Topo</button>
      </div>
      <label class="row" style="margin-top:8px"><input type="checkbox" id="chkContours"><span class="lbl">Contour lines <span class="note">Elevation in feet, shows when zoomed in</span></span></label>
    </section>

    <section class="sec">
      <h3>Wind <span id="windStamp" style="letter-spacing:0;text-transform:none;font-weight:500"></span></h3>
      <label class="row"><input type="checkbox" id="chkWind" checked><span class="lbl">Observed wind <span class="note">Arrows point downwind, where scent drifts</span></span></label>
      <div class="legend-wind" aria-hidden="true">
        <span><i style="background:#7fd67f"></i>&lt; 8 mph</span>
        <span><i style="background:#ffd73c"></i>8–14</span>
        <span><i style="background:#ff8c2a"></i>15–24</span>
        <span><i style="background:#e63030"></i>25+</span>
      </div>
      <p class="small" id="nearWind"></p>
    </section>

    <section class="sec">
      <h3>Public land <button class="pill" id="btnHunt" style="box-shadow:none;background:var(--chip);padding:4px 8px;font-size:12px">Hunting only</button></h3>
      <div class="slider"><span>Fill</span><input type="range" id="landOpacity" min="10" max="90" value="45" aria-label="Public land fill opacity"><span id="landOpacityVal">45%</span></div>
      <div id="landGroups"></div>
      <p class="small">Boundaries are approximate (USGS PAD-US 4.1). Hunting notes are general guidance; check Michigan DNR rules, seasons and safety zones.</p>
    </section>
  </div>
</aside>

<div class="toast" id="toast" hidden></div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="app.js"></script>
</body>
</html>
